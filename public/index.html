<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>localCam</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="stage">
  <video id="preview" autoplay muted playsinline></video>
  <div id="overlay">
    <div class="pill" id="statusPill"><span class="dot" id="dot"></span><span id="statusText">hazir</span></div>
    <div class="pill mono" id="statsPill" hidden></div>
  </div>
</div>

<div id="panel">
  <div id="error" hidden></div>

  <div class="row">
    <label for="cameraSel">Kamera</label>
    <select id="cameraSel"><option value="environment">Arka</option><option value="user">On</option></select>
  </div>

  <div class="row">
    <label for="resSel">Cozunurluk</label>
    <select id="resSel">
      <option value="1440x1080" selected>1080p geniş (4:3)</option>
      <option value="1920x1080">1080p (16:9)</option>
      <option value="1280x960">720p geniş (4:3)</option>
      <option value="1280x720">720p (16:9)</option>
      <option value="960x540">540p</option>
    </select>
  </div>

  <div class="row">
    <label for="modeSel">Yontem</label>
    <select id="modeSel">
      <option value="webrtc" selected>WebRTC (H.264, onerilen)</option>
      <option value="mjpeg">MJPEG (yedek)</option>
    </select>
  </div>

  <div class="row">
    <label>Goruntu</label>
    <div class="seg">
      <button class="segbtn" id="mirrorBtn" aria-pressed="false">Ayna</button>
      <button class="segbtn" id="rotateBtn">0&deg;</button>
    </div>
  </div>

  <div class="row">
    <label for="autoBtn">Acilista otomatik baslat</label>
    <div class="seg"><button class="segbtn" id="autoBtn" aria-pressed="false">Kapali</button></div>
  </div>

  <button id="startBtn" class="primary">Yayini baslat</button>
  <p class="hint">Paylas &rarr; <b>Ana Ekrana Ekle</b> dersen tek dokunusla acilir. Yayin sirasinda sayfayi kapatma; ekran acik tutulur.</p>
  <p class="hint"><a href="/localcam-ca.crt">Sertifikayi kur</a> &mdash; guvenlik uyarisi bir daha cikmasin (Ayarlar &rarr; Genel &rarr; VPN ve Cihaz Yonetimi, sonra Sertifika Guven Ayarlari).</p>
</div>

<script src="/app.js"></script>
</body>
</html>
